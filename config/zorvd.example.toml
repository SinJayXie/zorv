# Zorv server example config (zorvd)
#
# Copy to zorvd.toml and adjust for your environment.
# Supports TCP port forwarding, UDP proxying and traffic obfuscation
# (padding / heartbeat jitter). No ja3_profile support.

# Tunnel listen address: clients dial this address to establish the TLS tunnel.
tunnel_addr = "0.0.0.0:8443"

[tls]
# PEM certificate chain and private key paths (TLS 1.3 enforced).
cert_file = "/etc/zorv/server.crt"
key_file  = "/etc/zorv/server.key"

[auth]
# Pre-shared token shared with clients; must match exactly.
token = "your-strong-pre-shared-token-here"
# Optional IP allowlist (exact IP or IPv4 CIDR); only enforced by the server.
# Leave unset to allow any client IP.
# allowed_ips = ["1.2.3.4/32", "10.0.0.0/8"]

# Public proxy rule: connections to `listen` are forwarded through the tunnel
# to the `target` of the client identified by `client_id`.
[[proxies]]
name      = "web"
type      = "tcp"
listen    = "0.0.0.0:18080"
client_id = "home-nas"
target    = "127.0.0.1:8080"

[[proxies]]
name      = "ssh"
type      = "tcp"
listen    = "0.0.0.0:12222"
client_id = "home-nas"
target    = "127.0.0.1:22"

# UDP proxy: public UDP packets are forwarded through the tunnel to the
# client-side `target`.
[[proxies]]
name      = "dns-udp"
type      = "udp"
listen    = "0.0.0.0:15353"
client_id = "home-nas"
target    = "8.8.8.8:53"

[performance]
max_streams_per_tunnel = 1024
stream_buffer_size     = 262144
recv_buffer_size       = 1048576

# Traffic obfuscation: random padding flattens the packet-length distribution
# (frames sent to clients are padded as well).
[obfuscation]
padding     = true
padding_max = 255

# Web admin console: disabled by default. When enabled it listens on a separate
# port and lets you manage clients / proxy rules / tokens from a browser.
[admin]
enabled = true
# By default it is only reachable from localhost; for remote access add a
# reverse proxy or firewall restriction yourself.
listen  = "127.0.0.1:9000"
# Login credentials. Leave password empty to skip login; otherwise both the UI
# and the API require a login first.
# password accepts plaintext or a PBKDF2-HMAC-SHA256 hash (generate with
# `zorvd hash-password <plaintext>` and paste the result).
username = "admin"
password = "change-me"
# Optional: serve the admin console over HTTPS (PEM cert and key). Default is plain HTTP.
# [admin.tls]
# cert_file = "/etc/zorv/admin.crt"
# key_file  = "/etc/zorv/admin.key"

# Event notifications: POST JSON to the webhook when a client goes offline (optional).
# [notify]
# webhook = "https://example.com/hooks/zorv-offline"

[log]
level  = "info"
output = "./app.log"
