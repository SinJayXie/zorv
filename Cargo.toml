[package]
name = "zorv"
version = "1.1.1"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "zorv"
path = "src/main.rs"

[[bin]]
name = "zorvd"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
dashmap = "6"
hmac = "0.12"
rand = "0.8"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = "z"
debug = false
strip = true  # Strip debug symbols; critical for small binaries
overflow-checks = false
lto = true  # Link-time optimization; eliminates dead code and shrinks the binary
panic = "abort"  # Remove panic unwind tables to reduce size
incremental = false
codegen-units = 1  # Required for LTO to be effective; slower compile, smaller binary
