<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zorv Console · Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#F2F2F7] flex items-center justify-center p-4 text-[#1C1C1E]">
  <div class="w-full max-w-sm">
    <!-- Login card -->
    <div class="bg-white rounded-2xl p-5 sm:p-6">
      <div class="mb-5">
        <h1 class="text-xl font-bold text-center">Zorv Console</h1>
        <p class="text-sm text-[#8E8E93] text-center mt-1">Tunnel · Server Console</p>
      </div>
      <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1.5">Username</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8E8E93]" width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
          <input id="username" type="text" autocomplete="username" placeholder="Username"
            class="w-full bg-[#F2F2F7] border border-[#E5E5EA] rounded-xl pl-10 pr-3 py-3 text-[15px] placeholder:text-[#8E8E93] focus:outline-none focus:ring-2 focus:ring-[#007AFF] focus:border-[#007AFF] transition" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1.5">Password</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8E8E93]" width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <input id="password" type="password" autocomplete="current-password" placeholder="Password"
            class="w-full bg-[#F2F2F7] border border-[#E5E5EA] rounded-xl pl-10 pr-3 py-3 text-[15px] placeholder:text-[#8E8E93] focus:outline-none focus:ring-2 focus:ring-[#007AFF] focus:border-[#007AFF] transition" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1.5">Captcha</label>
        <div class="flex gap-3 items-center">
          <div class="relative flex-1">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8E8E93]" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6z" />
              <path d="M9.5 12l1.8 1.8 3.2-3.6" />
            </svg>
            <input id="captcha" type="text" maxlength="4" autocomplete="off" placeholder="Captcha Code"
              class="w-full uppercase bg-[#F2F2F7] border border-[#E5E5EA] rounded-xl pl-10 pr-3 py-3 text-[15px] placeholder:text-[#8E8E93] focus:outline-none focus:ring-2 focus:ring-[#007AFF] focus:border-[#007AFF] transition" />
          </div>
          <img id="captcha-img" alt="Captcha Image" title="Refresh captcha" onclick="refreshCaptcha()"
            class="h-[46px] w-32 shrink-0 rounded-xl border border-[#E5E5EA] cursor-pointer bg-[#F2F2F7]" />
        </div>
      </div>

      <p id="msg" class="text-sm text-[#FF3B30] min-h-[1.25rem]"></p>

      <button type="submit" id="login-btn"
        class="w-full bg-[#007AFF] text-white py-3 rounded-xl font-semibold text-[15px] hover:bg-[#0A84FF] active:bg-[#0066D6] transition disabled:opacity-60 disabled:cursor-not-allowed">Login</button>
      </form>
    </div>
  </div>

  <script>
    // Fetch the image captcha (the captcha id is carried automatically via Cookie)
    function refreshCaptcha() {
      const img = document.getElementById('captcha-img');
      img.src = '/api/captcha?t=' + Date.now(); // timestamp to bust the cache
      document.getElementById('captcha').value = '';
    }
    refreshCaptcha();

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const captcha_code = document.getElementById('captcha').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('login-btn');
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, captcha_code })
        });
        const j = await r.json();
        if (j.ok) {
          location.href = '/';
        } else {
          msg.textContent = 'Login failed: ' + (j.error || 'Login credentials are incorrect');
          refreshCaptcha();
        }
      } catch (err) {
        msg.textContent = 'Request failed';
        refreshCaptcha();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
