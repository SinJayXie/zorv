<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zorv Console · Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <nav class="bg-slate-800 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm sm:text-base">
      <span class="font-bold text-lg tracking-wide mr-auto">Zorv Console</span>
      <a href="/index.html" class="text-white border-b-2 border-white pb-0.5">Overview</a>
      <a href="/clients.html" class="text-slate-300 hover:text-white">Online Clients</a>
      <a href="/settings.html" class="text-slate-300 hover:text-white">Settings</a>
      <a href="/traffic.html" class="text-slate-300 hover:text-white">Traffic Monitoring</a>
      <a href="#" onclick="logout(event)" class="text-slate-300 hover:text-white">Logout</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6 sm:py-8">
    <h1 class="text-xl sm:text-2xl font-semibold mb-4 sm:mb-6">Overview</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4" id="cards">
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-sm text-slate-500">Online Clients</p>
        <p class="text-3xl font-bold mt-1" id="stat-clients">-</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-sm text-slate-500">Proxies</p>
        <p class="text-3xl font-bold mt-1" id="stat-proxies">-</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm col-span-2">
        <p class="text-sm text-slate-500">Tunnel Address</p>
        <p class="text-lg font-mono mt-1 break-all" id="stat-tunnel">-</p>
      </div>
    </div>
    <p class="text-xs text-slate-400 mt-4">Status load failed, please check if the service is running and the management port is reachable.</p>
  </main>

  <script>
    async function load() {
      try {
        const r = await fetch('/api/status');
        if (r.status === 401) { location.href = '/login.html'; return; }
        const s = await r.json();
        document.getElementById('stat-clients').textContent = s.clients;
        document.getElementById('stat-proxies').textContent = s.proxies;
        document.getElementById('stat-tunnel').textContent = s.tunnel_addr;
      } catch (e) {
        document.getElementById('stat-clients').textContent = 'ERR';
        document.getElementById('stat-proxies').textContent = 'ERR';
        document.getElementById('stat-tunnel').textContent = 'ERR';
      }
    }
    async function logout(e) {
      e.preventDefault();
      try { await fetch('/api/logout', { method: 'POST' }); } catch (err) {}
      location.href = '/login.html';
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
