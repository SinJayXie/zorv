<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zorv Console · Traffic Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <nav class="bg-slate-800 text-white shadow">
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm sm:text-base"
      >
        <span class="font-bold text-lg tracking-wide mr-auto"
          >Zorv Console</span
        >
        <a href="/index.html" class="text-slate-300 hover:text-white"
          >Overview</a
        >
        <a href="/clients.html" class="text-slate-300 hover:text-white"
          >Connected Clients</a
        >
        <a href="/settings.html" class="text-slate-300 hover:text-white"
          >Settings</a
        >
        <a
          href="/traffic.html"
          class="text-white border-b-2 border-white pb-0.5"
          >Traffic Monitoring</a
        >
        <a
          href="#"
          onclick="logout(event)"
          class="text-slate-300 hover:text-white"
          >Logout</a
        >
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6 sm:py-8">
      <div
        class="flex flex-wrap items-center justify-between gap-3 mb-4 sm:mb-6"
      >
        <h1 class="text-xl sm:text-2xl font-semibold">Traffic Monitoring</h1>
        <button
          onclick="load()"
          class="text-sm bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700"
        >
          Refresh
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-4 sm:p-5 mb-6">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 class="font-semibold">Traffic Monitoring Chart</h2>
          <span class="text-xs text-slate-400"
            >Last 100 minutes · 30s sampling · Click legend to toggle
            display</span
          >
        </div>
        <canvas id="chart" class="w-full h-52 sm:h-56"></canvas>
        <div id="chart-legend" class="mt-3 flex flex-wrap gap-3"></div>
      </div>

      <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div
          class="bg-white rounded-xl shadow-sm px-6 py-12 text-center text-slate-400"
        >
          Loading...
        </div>
      </div>
    </main>

    <script>
      function esc(s) {
        if (s === null || s === undefined) return "";
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function fmtBytes(n) {
        if (!n) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let i = 0;
        let v = n;
        while (v >= 1024 && i < units.length - 1) {
          v /= 1024;
          i++;
        }
        return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + " " + units[i];
      }
      function cell(label, val, cls) {
        return (
          '<div class="text-center">' +
          '<div class="text-xs text-slate-400 mb-1">' +
          label +
          "</div>" +
          '<div class="font-mono text-sm sm:text-base font-semibold ' +
          (cls || "text-slate-800") +
          '">' +
          val +
          "</div>" +
          "</div>"
        );
      }

      const PALETTE = [
        "#0284c7",
        "#059669",
        "#7c3aed",
        "#dc2626",
        "#d97706",
        "#0891b2",
        "#db2777",
        "#65a30d",
      ];
      let chartSeries = {}; // client_id -> {t:[ts], rate:[B/s]}
      let chartHidden = {}; // client_id -> bool

      function buildRateSeries(hist) {
        const series = {};
        for (let i = 1; i < hist.length; i++) {
          const prev = hist[i - 1],
            cur = hist[i];
          const dt = (cur.ts_ms - prev.ts_ms) / 1000;
          if (dt <= 0) continue;
          for (const cid of Object.keys(cur.totals)) {
            const t = cur.totals[cid];
            const p = (prev.totals && prev.totals[cid]) || {
              tcp_up: 0,
              tcp_down: 0,
              udp_up: 0,
              udp_down: 0,
            };
            const rate =
              (t.tcp_up -
                p.tcp_up +
                (t.tcp_down - p.tcp_down) +
                (t.udp_up - p.udp_up) +
                (t.udp_down - p.udp_down)) /
              dt;
            if (!series[cid]) series[cid] = { t: [], rate: [] };
            series[cid].t.push(cur.ts_ms);
            series[cid].rate.push(rate);
          }
        }
        return series;
      }

      function fmtTime(ms) {
        const d = new Date(ms);
        const p = (n) => String(n).padStart(2, "0");
        return p(d.getHours()) + ":" + p(d.getMinutes());
      }

      function drawChart() {
        const canvas = document.getElementById("chart");
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth || 600;
        const h = canvas.clientHeight || 224;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        const pad = { l: 64, r: 16, t: 12, b: 28 };
        const pw = w - pad.l - pad.r;
        const ph = h - pad.t - pad.b;

        const clients = Object.keys(chartSeries).filter((c) => !chartHidden[c]);
        let tMin = Infinity,
          tMax = -Infinity,
          maxRate = 0;
        for (const c of clients) {
          const s = chartSeries[c];
          if (!s.t.length) continue;
          if (s.t[0] < tMin) tMin = s.t[0];
          if (s.t[s.t.length - 1] > tMax) tMax = s.t[s.t.length - 1];
          for (const r of s.rate) if (r > maxRate) maxRate = r;
        }
        if (!isFinite(tMin) || tMax <= tMin || maxRate <= 0) {
          ctx.fillStyle = "#94a3b8";
          ctx.font = "14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(
            "No data available, click refresh to load",
            w / 2,
            h / 2,
          );
          return;
        }
        maxRate *= 1.1;

        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        ctx.font = "11px monospace";
        for (let i = 0; i <= 4; i++) {
          const y = pad.t + ph - (i / 4) * ph;
          ctx.beginPath();
          ctx.moveTo(pad.l, y);
          ctx.lineTo(w - pad.r, y);
          ctx.stroke();
          ctx.fillStyle = "#64748b";
          ctx.textAlign = "right";
          ctx.fillText(fmtBytes((maxRate * i) / 4) + "/s", pad.l - 6, y + 4);
        }

        ctx.textAlign = "center";
        ctx.fillStyle = "#64748b";
        for (let i = 0; i <= 4; i++) {
          const t = tMin + ((tMax - tMin) * i) / 4;
          const x = pad.l + (i / 4) * pw;
          ctx.fillText(fmtTime(t), x, h - 8);
        }

        const xOf = (t) => pad.l + ((t - tMin) / (tMax - tMin)) * pw;
        const yOf = (r) => pad.t + ph - (r / maxRate) * ph;
        clients.forEach((c, idx) => {
          const s = chartSeries[c];
          const color = PALETTE[idx % PALETTE.length];
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          let started = false;
          for (let i = 0; i < s.t.length; i++) {
            const x = xOf(s.t[i]);
            const y = yOf(s.rate[i]);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
      }

      function renderLegend() {
        const el = document.getElementById("chart-legend");
        const clients = Object.keys(chartSeries);
        el.innerHTML = clients
          .map((c, i) => {
            const off = chartHidden[c] ? "opacity-40 line-through" : "";
            return (
              '<button data-legend="' +
              esc(c) +
              '" class="' +
              off +
              ' flex items-center gap-1.5 text-sm text-slate-600 hover:text-slate-900">' +
              '<span class="inline-block w-3 h-3 rounded-full" style="background:' +
              PALETTE[i % PALETTE.length] +
              '"></span>' +
              esc(c) +
              "</button>"
            );
          })
          .join("");
      }

      async function load() {
        const cards = document.getElementById("cards");
        try {
          const [hRes, tRes] = await Promise.all([
            fetch("/api/traffic/history"),
            fetch("/api/traffic"),
          ]);
          if (hRes.status === 401 || tRes.status === 401) {
            location.href = "/login.html";
            return;
          }
          const hist = await hRes.json();
          const list = await tRes.json();

          chartSeries = buildRateSeries(hist);

          Object.keys(chartSeries).forEach((c) => {
            if (chartHidden[c] === undefined) chartHidden[c] = false;
          });
          renderLegend();
          drawChart();
          if (!list.length) {
            cards.innerHTML =
              '<div class="bg-white rounded-xl shadow-sm px-6 py-12 text-center text-slate-400 col-span-2">No traffic data available, click refresh to load</div>';
            return;
          }
          cards.innerHTML = list
            .map((t) => {
              const dot = t.online
                ? '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>Online'
                : '<span class="inline-block w-2 h-2 rounded-full bg-slate-300 mr-1"></span>Offline';
              return (
                '<div class="bg-white rounded-xl shadow-sm p-4 sm:p-5">' +
                '<div class="flex flex-wrap items-center justify-between gap-2 mb-4">' +
                '<span class="font-mono font-semibold text-slate-700 break-all">' +
                esc(t.client_id) +
                "</span>" +
                '<span class="text-xs text-slate-500">' +
                dot +
                "</span>" +
                "</div>" +
                '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">' +
                cell("TCP Upload", fmtBytes(t.tcp_up), "text-sky-600") +
                cell("TCP Download", fmtBytes(t.tcp_down), "text-sky-600") +
                cell("UDP Upload", fmtBytes(t.udp_up), "text-violet-600") +
                cell("UDP Download", fmtBytes(t.udp_down), "text-violet-600") +
                "</div>" +
                "</div>"
              );
            })
            .join("");
        } catch (e) {
          cards.innerHTML =
            '<div class="bg-white rounded-xl shadow-sm px-6 py-12 text-center text-red-400 col-span-2">Loading failed</div>';
        }
      }

      async function logout(e) {
        e.preventDefault();
        try {
          await fetch("/api/logout", { method: "POST" });
        } catch (err) {}
        location.href = "/login.html";
      }

      document.addEventListener("click", function (e) {
        const leg = e.target.closest("[data-legend]");
        if (leg) {
          const c = leg.dataset.legend;
          chartHidden[c] = !chartHidden[c];
          renderLegend();
          drawChart();
        }
      });
      window.addEventListener("resize", drawChart);
      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
